version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inquisitors-postgres
    restart: always
    environment:
      POSTGRES_USER: inquisitors
      POSTGRES_PASSWORD: inquisitors123
      POSTGRES_DB: inquisitors_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inquisitors"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inquisitors-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inquisitors-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://inquisitors:inquisitors123@postgres:5432/inquisitors_db?schema=public"
      JWT_SECRET: "inquisitors-super-secret-jwt-key-2026"
      JWT_REFRESH_SECRET: "inquisitors-super-secret-refresh-key-2026"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start:prod"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inquisitors-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
